name: MkAssistant
options:
  bundleIdPrefix: com.mkassistant
  deploymentTarget:
    iOS: "15.6"
settings:
  base:
    SWIFT_VERSION: "5.7"
    IPHONEOS_DEPLOYMENT_TARGET: "15.6"
targets:
  MkAssistant:
    type: application
    platform: iOS
    sources:
      - path: MkAssistant
        excludes:
          - Config/Info.plist
          - Config/MkAssistant.entitlements
    info:
      path: MkAssistant/Config/Info.plist
      properties:
        CFBundleIdentifier: com.mkassistant.app
        CFBundleName: MkAssistant
        CFBundleDisplayName: MK Assistant
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: MkAssistant uses the microphone to hear your hands-free voice commands.
        NSSpeechRecognitionUsageDescription: MkAssistant uses speech recognition to understand your voice commands.
        UIBackgroundModes:
          - audio
    entitlements:
      path: MkAssistant/Config/MkAssistant.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mkassistant.app
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1"
