name: Build MkAssistant IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bundle Arabic Kareem TTS model
        run: |
          mkdir -p MkAssistant/Resources/TTS
          curl -L --fail --retry 3 -o /tmp/kareem.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ar_JO-kareem-medium-int8.tar.bz2
          tar -xjf /tmp/kareem.tar.bz2 -C /tmp
          MODEL=$(find /tmp -type f -name '*.onnx' | grep 'kareem' | head -1)
          SRC=$(dirname "$MODEL")
          echo "Model directory: $SRC"
          find "$SRC" -maxdepth 2 -type f | head -30
          cp "$MODEL" MkAssistant/Resources/TTS/kareem.onnx
          cp "$SRC"/tokens.txt MkAssistant/Resources/TTS/tokens.txt
          cp -R "$SRC"/espeak-ng-data MkAssistant/Resources/TTS/espeak-ng-data
          test -s MkAssistant/Resources/TTS/kareem.onnx
          test -s MkAssistant/Resources/TTS/tokens.txt
          test -d MkAssistant/Resources/TTS/espeak-ng-data

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project MkAssistant.xcodeproj \
            -scheme MkAssistant \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MkAssistant.app Payload/
          zip -qry MkAssistant-unsigned.ipa Payload

      - name: Install ldid
        run: brew install ldid

      - name: Sign for TrollStore
        run: |
          ldid -SMkAssistant/Config/MkAssistant.entitlements Payload/MkAssistant.app/MkAssistant
          zip -qry MkAssistant-TrollStore.ipa Payload

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MkAssistant-IPA
          path: |
            MkAssistant-unsigned.ipa
            MkAssistant-TrollStore.ipa
